[project]
name = "dna-kda"
version = "0.1.0"
description = "Gated Linear Attention (KDA) for genomic sequence modeling"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "numpy>=1.26",
    "einops>=0.8",
    "python-dotenv>=1.0",
    "mlflow>=2.18",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "biopython>=1.84",
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "tiktoken>=0.8",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "flash-linear-attention>=0.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipython>=8.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["dataset", "models", "training"]
