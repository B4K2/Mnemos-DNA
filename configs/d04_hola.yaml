# D04: HOLA — KDA + bounded exact-KV "hippocampus" cache (arXiv 2607.02303), NoPE, ~2M params.
#
# Same backbone as d01_new (the NoPE KDA arm) so d01_new -> d04 isolates the cache alone —
# the paper's own GDN-vs-HOLA control. NoPE matches both the paper's backbone and d01_new;
# comparing against d02 (ntk_rope) crosses the positional axis — flag that in any writeup.

model_id: d04
run_name: d04-hola-kda-cache-nope-2m

attention_type: kda_hola
pos_type: none

# --- The HOLA knobs (paper defaults: w=64, C=256, gate init -4) -------------------------------
hola_window: 64
hola_chunk: 256
hola_gate_init: -4.0

d_model: 128
num_layers: 8
num_heads: 4              # head_dim 32

# --- Throughput / optimizer-step budget -------------------------------------------------------
context_length: 65536
batch_size: 4
grad_accum_steps: 1
gradient_checkpointing: true

training_tokens: 5_000_000_000

# --- LR schedule (identical to d02_kda_local.yaml) --------------------------------------------
lr_schedule: cosine
learning_rate: 1.0e-3
warmup_steps: 200
lr_min_ratio: 0.1

eval_interval_steps: 200
checkpoint_interval_steps: 500

# Everything else (weight_decay, dataset_dir, precision, ...) comes from base.yaml.
