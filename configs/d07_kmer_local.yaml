# D07: D06 (KDA + per-k-mer fast-weight memory, NoPE) + one windowed local-attention layer per
# hybrid_ratio KDA layers (D02's hybrid schedule), trained with the sequence-length curriculum.
# Everything model-side is d06_kmer_fastweight.yaml except the two hybrid keys; the curriculum
# block is the training-side change (run d06 with the same block as the control).

model_id: d07
run_name: d07-kda-kmer-fw-local256-nope-2m-curriculum

attention_type: kda_kmer_fw_local
pos_type: none

# --- hybrid (from D02; window 256 not 512 so a 300-600bp NT sequence is not one exact hop) ----
hybrid_ratio: 4          # 4 KDA+k-mer layers per local layer -> local layer at block index 4
window_size: 256         # effective causal window 256..511 (blocked, see local_attention.py)

# --- k-mer fast-weight memory (identical to d06) ---------------------------------------------
kmer_mem_k: 8
kmer_fw_dk: 16
kmer_fw_dv: 16
kmer_mem_scan_chunk: 32
kmer_mem_gate_init: -1.0
kmer_mem_write_gate_init: 0.0
kmer_mem_layers: all
kmer_mem_hierarchical_ks: []
kmer_mem_reset_per_sequence: true

d_model: 128
num_layers: 8
num_heads: 4

context_length: 131072
batch_size: 1
grad_accum_steps: 1
gradient_checkpointing: true

# --- sequence-length curriculum (training/curriculum.py) -------------------------------------
# tokens/step stays batch_size*context_length*grad_accum_steps = 131072; short lengths mean
# more sequences per step, in micro-batches of <= max_micro_batch (k-mer memory ~0.6 GB/seq).
seq_curriculum:
  start_len: 1024
  warmup_frac: 0.1                     # 1k -> 2k -> ... -> 131k over the first 10% of steps
  mix: {1024: 0.25, 16384: 0.25, 131072: 0.5}   # then per-step length draw, weights = step share
  max_micro_batch: 4
  # Peak VRAM tracks tokens-in-flight, not sequences: 131072 tokens is 4.35 GiB as 1x131072 but
  # 6.17 GiB as 4x32768 (measured on the 5060, fwd+bwd on hg38 windows) -- the latter OOMs mid-run.
  max_micro_tokens: 65536
  seed: 0

training_tokens: 5_000_000_000

lr_schedule: cosine
learning_rate: 1.0e-3
warmup_steps: 200
lr_min_ratio: 0.1

eval_interval_steps: 200
checkpoint_interval_steps: 100
