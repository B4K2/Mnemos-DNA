# D05-rope: KDA + discrete k-mer addressed memory + NTK-scaled RoPE, ~2M params.

model_id: d05_rope
run_name: d05-rope-kda-kmer-mem-ntkrope-2m

attention_type: kda_kmer_mem
pos_type: ntk_rope
rope_base: 10000.0

kmer_mem_k: 8                 
kmer_mem_dim: 32              
kmer_mem_slots_per_kmer: 1    
kmer_mem_hierarchical_ks: []  
kmer_mem_gate_init: -1.0      
kmer_mem_update: gated_ema    
kmer_mem_layers: all          
kmer_mem_alphabet: ACGT       
kmer_mem_reset_per_sequence: true   

d_model: 128
num_layers: 8
num_heads: 4             

context_length: 131072
batch_size: 1
grad_accum_steps: 1
gradient_checkpointing: true

training_tokens: 5_000_000_000

lr_schedule: cosine
learning_rate: 1.0e-3
warmup_steps: 200
lr_min_ratio: 0.1

eval_interval_steps: 200
checkpoint_interval_steps: 500