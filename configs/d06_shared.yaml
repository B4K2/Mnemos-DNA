# D06 with every event on one shared 16x16 fast-weight matrix: memory without addressing.
# Review ablation (2026-09-15): identical to configs/d06_kmer_fastweight.yaml except the
# lines marked REVIEW. Same 131072 context, 5B tokens, LR schedule and data order.
model_id: d06_shared
run_name: d06-shared
model_module: d06


attention_type: kda_kmer_fw
pos_type: none

kmer_mem_address_mode: shared          # REVIEW
kmer_mem_k: 8                 
kmer_fw_dk: 16                
kmer_fw_dv: 16                
kmer_mem_scan_chunk: 512    # REVIEW: one 262k-event chain; exact for any chunk. 1024 OOMs, 256 is ~102h
                              
kmer_mem_gate_init: -1.0      
kmer_mem_write_gate_init: 0.0 
                              
                              
                
kmer_mem_layers: all
kmer_mem_hierarchical_ks: []
kmer_mem_reset_per_sequence: true

d_model: 128
num_layers: 8
num_heads: 4             

context_length: 131072 
batch_size: 1
grad_accum_steps: 1
gradient_checkpointing: true

training_tokens: 4_500_000_000

lr_schedule: cosine
learning_rate: 1.0e-3
warmup_steps: 200
lr_min_ratio: 0.1

eval_interval_steps: 200
checkpoint_interval_steps: 100  
