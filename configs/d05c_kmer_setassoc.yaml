# D05c: D05 + S-way set-associative slots per k-mer address. Single-axis change from

model_id: d05c
model_module: d05            
run_name: d05c-kda-kmer-setassoc-nope-2m

attention_type: kda_kmer_mem
pos_type: none

kmer_mem_k: 8                 
kmer_mem_scan_chunk: 8        
kmer_mem_dim: 32              
kmer_mem_slots_per_kmer: 4    
kmer_mem_router_mode: top1_ste  
kmer_mem_router_temp: 1.0     
kmer_mem_balance_coef: 0.01   
kmer_mem_hierarchical_ks: []  
kmer_mem_gate_init: -1.0      
kmer_mem_layers: all          
kmer_mem_alphabet: ACGT       
kmer_mem_reset_per_sequence: true   

d_model: 128
num_layers: 8
num_heads: 4              

context_length: 65536         
batch_size: 1
grad_accum_steps: 1
gradient_checkpointing: true

training_tokens: 5_000_000_000

lr_schedule: cosine
learning_rate: 1.0e-3
warmup_steps: 200
lr_min_ratio: 0.1

eval_interval_steps: 200
checkpoint_interval_steps: 500