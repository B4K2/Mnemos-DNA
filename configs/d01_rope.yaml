# D01-rope: pure KDA + NTK-scaled RoPE, ~2.25M params. The paired RoPE arm for configs/d01_new.yaml
model_id: d01_rope
run_name: d01-rope-kda-ntkrope-2m

attention_type: kda
pos_type: ntk_rope        
rope_base: 10000.0

d_model: 128
num_layers: 8
num_heads: 4              # head_dim 32

# --- Throughput / optimizer-step budget -------------------------------------------------------
context_length: 262144
batch_size: 1
grad_accum_steps: 1
gradient_checkpointing: true

training_tokens: 5_000_000_000

# --- LR schedule ------------------------------------------------------------------------------
lr_schedule: cosine
learning_rate: 1.0e-3
warmup_steps: 200
lr_min_ratio: 0.1

eval_interval_steps: 200
checkpoint_interval_steps: 500

# Everything else (weight_decay, dataset_dir, precision, ...) comes from base.yaml.
