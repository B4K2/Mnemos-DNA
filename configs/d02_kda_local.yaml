# D02-local-rope: KDA + windowed local attention + NTK-scaled RoPE, ~2M params.

model_id: d02
run_name: d02-kda-local-ntkrope-2m

attention_type: kda_local

# --- Positional scheme (matches d01_rope.yaml) ------------------------------------------------
pos_type: ntk_rope
rope_base: 10000.0

# --- The local-attention hybrid (the axis under test vs d01_rope) -----------------------------
hybrid_ratio: 4         
window_size: 512  
                        

d_model: 128
num_layers: 8
num_heads: 4             

# --- Throughput / optimizer-step budget --------------------------
context_length: 262144
batch_size: 1
grad_accum_steps: 1
gradient_checkpointing: true

training_tokens: 5_000_000_000

# --- LR schedule -------------------------------------------------
lr_schedule: cosine
learning_rate: 1.0e-3    
warmup_steps: 200
lr_min_ratio: 0.1

eval_interval_steps: 200
checkpoint_interval_steps: 500   

# Everything else (weight_decay, dataset_dir, precision, ...) comes from base.yaml.
