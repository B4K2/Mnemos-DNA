# Control for D07: d06 architecture, trained with the same sequence-length curriculum.
# d06 (fixed 131K) -> d06_curr isolates the curriculum; d06_curr -> d07 isolates the local window.
# D06: KDA + per-k-mer fast-weight (delta-rule) memory, NoPE, ~2M backbone.

model_id: d06_curr
model_module: d06
run_name: d06-kda-kmer-fastweight-nope-2m-curriculum

attention_type: kda_kmer_fw
pos_type: none

kmer_mem_k: 8                 
kmer_fw_dk: 16                
kmer_fw_dv: 16                
kmer_mem_scan_chunk: 32       
                              
kmer_mem_gate_init: -1.0      
kmer_mem_write_gate_init: 0.0 
                              
                              
                
kmer_mem_layers: all
kmer_mem_hierarchical_ks: []
kmer_mem_reset_per_sequence: true

d_model: 128
num_layers: 8
num_heads: 4             

context_length: 131072 
batch_size: 1
grad_accum_steps: 1
gradient_checkpointing: true

training_tokens: 5_000_000_000

lr_schedule: cosine
learning_rate: 1.0e-3
warmup_steps: 200
lr_min_ratio: 0.1

eval_interval_steps: 200
checkpoint_interval_steps: 100  

seq_curriculum:
  start_len: 1024
  warmup_frac: 0.1
  mix: {1024: 0.25, 16384: 0.25, 131072: 0.5}
  max_micro_batch: 4
  seed: 0
