<svg viewBox="0 0 740 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mnemos-DNA architecture, drawn vertically with the input at the bottom: the eight-block stack with block 4 replaced by local attention in Mnemos-DNA-C, and one block's pre-norm residual datapath with its four sigmoid gates (KDA forget and write strength; k-mer memory write and read gates)." style="font-family:'IBM Plex Sans',system-ui,sans-serif" fill="#1C1B18">
<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1C1B18"/></marker><marker id="arrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"/></marker><marker id="arrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#eb6834"/></marker><marker id="arrM" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6B6A64"/></marker></defs>
<text x="8" y="20" font-size="12.5" text-anchor="start" fill="#1C1B18" font-weight="600" font-style="normal">a &#183; the stack &#8212; 8 blocks, d = 128,</text>
<text x="8" y="36" font-size="12.5" text-anchor="start" fill="#1C1B18" font-weight="600" font-style="normal">4 heads, no positional encoding</text>
<text x="115" y="452" font-size="11" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">&#8230; A C G T G G N &#8230;</text>
<text x="115" y="466" font-size="9" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">1 token = 1 base</text>
<line x1="115" y1="442" x2="115" y2="428" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="40.0" y="401.0" width="150" height="26" rx="3" fill="none" fill-opacity="0.12" stroke="#1C1B18" stroke-width="1.1"/>
<text x="115" y="418" font-size="10" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">embed &#183; d = 128</text>
<line x1="115" y1="401" x2="115" y2="391" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="40.0" y="366.0" width="150" height="24" rx="3" fill="none" fill-opacity="0.12" stroke="#1C1B18" stroke-width="1.1"/>
<text x="115" y="382" font-size="10" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">block 0</text>
<line x1="115" y1="366" x2="115" y2="356" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="40.0" y="332.0" width="150" height="24" rx="3" fill="none" fill-opacity="0.12" stroke="#1C1B18" stroke-width="1.1"/>
<text x="115" y="348" font-size="10" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">block 1</text>
<line x1="115" y1="332" x2="115" y2="326" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<text x="115" y="318" font-size="12" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">&#8942;</text>
<text x="203" y="318" font-size="8.5" text-anchor="start" fill="#6B6A64" font-weight="normal" font-style="normal">blocks 2&#8211;3</text>
<line x1="115" y1="308" x2="115" y2="298" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="40.0" y="269.0" width="150" height="28" rx="3" fill="#eb6834" fill-opacity="0.12" stroke="#eb6834" stroke-width="1.7"/>
<text x="115" y="287" font-size="10.5" text-anchor="middle" fill="#eb6834" font-weight="600" font-style="normal">block 4</text>
<line x1="115" y1="268" x2="115" y2="258" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<text x="115" y="250" font-size="12" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">&#8942;</text>
<text x="203" y="250" font-size="8.5" text-anchor="start" fill="#6B6A64" font-weight="normal" font-style="normal">blocks 5&#8211;6</text>
<line x1="115" y1="240" x2="115" y2="230" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="40.0" y="205.0" width="150" height="24" rx="3" fill="none" fill-opacity="0.12" stroke="#1C1B18" stroke-width="1.1"/>
<text x="115" y="221" font-size="10" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">block 7</text>
<line x1="115" y1="205" x2="115" y2="195" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="40.0" y="170.0" width="150" height="24" rx="3" fill="none" fill-opacity="0.12" stroke="#1C1B18" stroke-width="1.1"/>
<text x="115" y="186" font-size="10" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">norm &#183; LM head</text>
<line x1="115" y1="170" x2="115" y2="158" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<text x="115" y="150" font-size="10" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">p(next base)</text>
<line x1="190.0" y1="283" x2="204.0" y2="283" stroke="#eb6834" stroke-width="1.1"/>
<text x="208.0" y="266" font-size="8.5" text-anchor="start" fill="#eb6834" font-weight="600" font-style="normal">Mnemos-DNA-C only:</text>
<text x="208.0" y="278" font-size="8.5" text-anchor="start" fill="#eb6834" font-weight="normal" font-style="normal">causal local attention, window 256</text>
<text x="208.0" y="290" font-size="8.5" text-anchor="start" fill="#6B6A64" font-weight="normal" font-style="normal">(in Mnemos-DNA this is a KDA</text>
<text x="208.0" y="301" font-size="8.5" text-anchor="start" fill="#6B6A64" font-weight="normal" font-style="normal">block like all the others)</text>
<text x="400" y="20" font-size="12.5" text-anchor="start" fill="#1C1B18" font-weight="600" font-style="normal">b &#183; one block &#8212; pre-norm residual datapath,</text>
<text x="400" y="36" font-size="12.5" text-anchor="start" fill="#1C1B18" font-weight="600" font-style="normal">and the four gates that steer the mixer</text>
<text x="460" y="452" font-size="11" text-anchor="middle" fill="#1C1B18" font-weight="600" font-style="italic">x</text>
<text x="467" y="455" font-size="8" fill="#1C1B18">&#8467;</text>
<line x1="460" y1="442" x2="460" y2="432" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="385.0" y="407.0" width="150" height="24" rx="3" fill="none" fill-opacity="1" stroke="#1C1B18" stroke-width="1.1"/>
<text x="460" y="423" font-size="9.5" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">RMSNorm</text>
<line x1="460" y1="407" x2="460" y2="397" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="385.0" y="355.0" width="150" height="42" rx="3" fill="none" fill-opacity="1" stroke="#1C1B18" stroke-width="1.3"/>
<text x="460" y="375" font-size="10" text-anchor="middle" fill="#1C1B18" font-weight="600" font-style="normal">sequence mixer</text>
<text x="460" y="387" font-size="8" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">KDA state + k-mer memory (Fig. 2)</text>
<line x1="460" y1="355" x2="460" y2="341" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<circle cx="460" cy="331" r="10" fill="#ffffff" stroke="#1C1B18" stroke-width="1.2"/>
<text x="460" y="335" font-size="12" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">+</text>
<line x1="460" y1="321" x2="460" y2="311" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="385.0" y="286.0" width="150" height="24" rx="3" fill="none" fill-opacity="1" stroke="#1C1B18" stroke-width="1.1"/>
<text x="460" y="302" font-size="9.5" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">RMSNorm</text>
<line x1="460" y1="286" x2="460" y2="276" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<rect x="385.0" y="251.0" width="150" height="24" rx="3" fill="none" fill-opacity="1" stroke="#1C1B18" stroke-width="1.1"/>
<text x="460" y="267" font-size="9.5" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">SwiGLU FFN</text>
<line x1="460" y1="251" x2="460" y2="237" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<circle cx="460" cy="227" r="10" fill="#ffffff" stroke="#1C1B18" stroke-width="1.2"/>
<text x="460" y="231" font-size="12" text-anchor="middle" fill="#1C1B18" font-weight="normal" font-style="normal">+</text>
<line x1="460" y1="217" x2="460" y2="207" stroke="#1C1B18" stroke-width="1.1" marker-end="url(#arr)"/>
<text x="460" y="198" font-size="11" text-anchor="middle" fill="#1C1B18" font-weight="600" font-style="italic">x</text>
<text x="467" y="201" font-size="8" fill="#1C1B18">&#8467;+1</text>
<path d="M460 437 C 370 430, 370 338, 449 331" fill="none" stroke="#6B6A64" stroke-width="1.1" marker-end="url(#arrM)"/>
<text x="364" y="388" font-size="8.5" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">residual</text>
<path d="M460 316 C 370 310, 370 233, 449 227" fill="none" stroke="#6B6A64" stroke-width="1.1" marker-end="url(#arrM)"/>
<text x="364" y="274" font-size="8.5" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">residual</text>
<text x="566" y="232" font-size="9.5" text-anchor="start" fill="#6B6A64" font-weight="normal" font-style="normal">four per-token gates,</text>
<text x="566" y="244" font-size="9.5" text-anchor="start" fill="#6B6A64" font-weight="normal" font-style="normal">each &#963;(learned proj of h</text>
<text x="680" y="247" font-size="7" fill="#6B6A64">t</text>
<text x="684" y="244" font-size="9.5" fill="#6B6A64">):</text>
<rect x="566" y="256" width="166" height="32" rx="4" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.2"/>
<text x="649.0" y="269" font-size="9.5" text-anchor="middle" fill="#2a78d6" font-weight="600" font-style="normal">&#945; &#183; KDA forget</text>
<text x="649.0" y="282" font-size="8" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">diag decay of the state S</text>
<path d="M566 272 C 542 272, 555.0 376, 537.0 376" fill="none" stroke="#2a78d6" stroke-width="0.9" opacity="0.55" marker-end="url(#arrB)"/>
<rect x="566" y="296" width="166" height="32" rx="4" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.2"/>
<text x="649.0" y="309" font-size="9.5" text-anchor="middle" fill="#2a78d6" font-weight="600" font-style="normal">&#946; &#183; KDA write strength</text>
<text x="649.0" y="322" font-size="8" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">scales the delta-rule write</text>
<path d="M566 312 C 542 312, 555.0 376, 537.0 376" fill="none" stroke="#2a78d6" stroke-width="0.9" opacity="0.55" marker-end="url(#arrB)"/>
<rect x="566" y="336" width="166" height="32" rx="4" fill="#eb6834" fill-opacity="0.1" stroke="#eb6834" stroke-width="1.2"/>
<text x="649.0" y="349" font-size="9.5" text-anchor="middle" fill="#eb6834" font-weight="600" font-style="normal">g_w &#183; memory write</text>
<text x="649.0" y="362" font-size="8" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">&#963;(0) = 0.50 at init</text>
<path d="M566 352 C 542 352, 555.0 376, 537.0 376" fill="none" stroke="#eb6834" stroke-width="0.9" opacity="0.55" marker-end="url(#arrO)"/>
<rect x="566" y="376" width="166" height="32" rx="4" fill="#eb6834" fill-opacity="0.1" stroke="#eb6834" stroke-width="1.2"/>
<text x="649.0" y="389" font-size="9.5" text-anchor="middle" fill="#eb6834" font-weight="600" font-style="normal">g_r &#183; memory read</text>
<text x="649.0" y="402" font-size="8" text-anchor="middle" fill="#6B6A64" font-weight="normal" font-style="normal">&#963;(&#8722;1) = 0.27 at init</text>
<path d="M566 392 C 542 392, 555.0 376, 537.0 376" fill="none" stroke="#eb6834" stroke-width="0.9" opacity="0.55" marker-end="url(#arrO)"/>
<text x="566" y="428" font-size="8" text-anchor="start" fill="#6B6A64" font-weight="normal" font-style="normal">all gate parameters kept in fp32</text>
<text x="566" y="439" font-size="8" text-anchor="start" fill="#6B6A64" font-weight="normal" font-style="normal">(scalar gates freeze under bf16 rounding)</text>
</svg>